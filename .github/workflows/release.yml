# 七喵记账 — GitHub Release 自动发布
#
# 触发方式（二选一）：
#   1. 打 tag 并推送：git tag v0.3.0 && git push origin v0.3.0
#      （tag 的版本号必须与 project.yaml 里的 version 一致，否则工作流会失败）
#   2. 手动触发：Actions 页 → Release → Run workflow，可填 version
#      （留空则读 project.yaml；填了且与 project.yaml 不同时，仅在 runner 内
#       临时改写 project.yaml 的 version 用于打包，不会提交回仓库）
#
# 流程：检出代码 → 装 pnpm + Node + Go → 下载 ugcli → 跑 build.sh --pack
# （amd64）→ 用 gh CLI 创建 Release 并上传 .upk。
# 发布的是 amd64 包（绿联 DXP4800 是 x86_64）；需要 arm64 时把 --arch 改成 all。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（x.y.z，留空则读 project.yaml）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 构建工具缓存：zig / ugcli / RapidOCR 每次发布都要从网上现下，
      # 其中 zig（ziglang.org）和 ugcli（osswaf，约 1MB/s）都很慢，
      # 而 Runner 每次都是全新机器，不缓存就等于每发一版重下一遍。
      # 命中时下面三个“安装”步骤直接跳过，只留环境配置和校验。
      # 升级任一工具版本时，同步改 key，否则会一直命中旧缓存。
      - name: 缓存构建工具（zig / ugcli / RapidOCR）
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zig
            ~/.local/bin/ugcli
            third_party/rapidocr
          key: tools-zig-0.15.1-ugcli-v1.1.0.25-rapidocr-v6.7.1

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: 安装 zig
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          # build.sh 编原生启动器优先走 zig；Runner 上没有 zig 时会退到
          # Docker 拉镜像 + apt 装交叉编译器，又慢又容易失败。
          # 注意：zig 不能只拷二进制文件，它运行时要找同目录下的 lib/，
          # 所以整个解压目录都要保留，并把该目录加进 PATH。
          mkdir -p "$HOME/.local/zig"
          curl -fSL --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 300 --retry-max-time 900 \
            -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig"

      - name: 配置 zig 环境
        run: |
          # $GITHUB_PATH 只对后面的步骤生效，本步骤里 PATH 还没有 zig，
          # 所以这里必须用完整路径验版本（直接写 zig version 会 127）。
          echo "$HOME/.local/zig/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig-x86_64-linux-0.15.1/zig" version

      - name: 安装 ugcli
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          # osswaf 下载源较慢且偶有超时，加重试（单轮最多 5 分钟，总计不超过 15 分钟）
          curl -fSL --retry 3 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 300 --retry-max-time 900 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o "$HOME/.local/bin/ugcli" \
            "https://osswaf.ugnas.com/pro/ugcli/download/ugcli-v1.1.0.25-linux-amd64"
          chmod +x "$HOME/.local/bin/ugcli"

      - name: 配置 ugcli 环境
        run: |
          # 同上：PATH 本步骤内不生效，用完整路径校验。
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ugcli" --version

      - name: 确定版本号
        id: version
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(grep '^version:' project.yaml | head -n1 | awk '{print $2}' | tr -d '"' | tr -d "'")"
          echo "project.yaml version: $PROJECT_VERSION"
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::tag v$VERSION 与 project.yaml 的 version $PROJECT_VERSION 不一致，请先把 project.yaml 改成 $VERSION 再打 tag"
              exit 1
            fi
          else
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
              if [ "$VERSION" != "$PROJECT_VERSION" ]; then
                echo "手动指定的 version $VERSION 与 project.yaml 不同，仅在 runner 内临时改写 project.yaml（不提交）"
                sed -i "s/^version: .*/version: \"$VERSION\"/" project.yaml
                grep '^version:' project.yaml
              fi
            else
              VERSION="$PROJECT_VERSION"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本：$VERSION（tag v$VERSION）"

      - name: 下载 RapidOCR（PP-OCRv6）
        run: |
          # 本地 OCR 程序 + 模型（约 100MB 下载），供 build.sh 打进 .upk。
          # 脚本内含 SHA-256 校验；已下载过会跳过。
          bash scripts/download-rapidocr.sh

      - name: 构建并打包 .upk（amd64）
        run: |
          ./build.sh --pack --build "${{ github.run_number }}" --arch amd64
          echo "=== 打包产物 ==="
          ls -la build_dir/pkgs/upk/

      - name: 创建 Release 并上传 .upk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            build_dir/pkgs/upk/*.upk \
            --title "七喵记账 ${{ steps.version.outputs.tag }}" \
            --generate-notes
